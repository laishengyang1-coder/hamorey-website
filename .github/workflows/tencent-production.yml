name: Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tencent-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure restricted SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.TENCENT_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Package exact main commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --output="$RUNNER_TEMP/hamorey-$EXPECTED_COMMIT.tar.gz" \
            "$EXPECTED_COMMIT"

      - name: Upload and deploy exact main commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hamorey-$EXPECTED_COMMIT.tar.gz"
          output_file="$(mktemp)"

          for attempt in 1 2 3; do
            if cat "$archive" | ssh \
              -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              ubuntu@134.175.187.12 \
              "deploy-archive $EXPECTED_COMMIT" | tee "$output_file"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Release upload/deployment failed after $attempt attempts."
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          grep -F "HAMOREY_PRODUCTION_DEPLOYED $EXPECTED_COMMIT" "$output_file"

      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --max-time 15 \
            https://api.hemoppf.cn/api/health)"
          node -e '
            const health = JSON.parse(process.argv[1]);
            const checks = health.checks || {};
            if (
              health.ok !== true ||
              checks.api !== "ok" ||
              checks.mysql !== "ok" ||
              checks.cos !== "ok"
            ) {
              console.error(health);
              process.exit(1);
            }
            console.log("Tencent production health verified.");
          ' "$response"

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --output /dev/null https://hemoppf.cn/
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --output /dev/null https://system.hemoppf.cn/login/admin
